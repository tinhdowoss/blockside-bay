<!doctype html>
<!-- BLOCKSIDE BAY: the page shell. One WebGL canvas plus four overlay layers (HUD, dialogue, menus, toast);
     three.js loads first as a classic script, then src/core/main.js boots the game as an ES module.
     No network requests: everything is served from this folder, so it works offline. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BLOCKSIDE BAY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hud.css">
  <link rel="stylesheet" href="menus.css">
</head>
<body>
  <div id="game-root">
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="dialogue"></div>
    <div id="menus"></div>
    <div id="toast"></div>
  </div>
  <script src="vendor/three.min.js"></script>
  <script type="module" src="src/core/main.js"></script>
</body>
</html>
